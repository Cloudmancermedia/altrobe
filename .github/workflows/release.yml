name: Release

# Builds the downloadable packages and attaches them to a draft GitHub Release. Someone checks the
# draft and publishes it by hand. See docs/releasing.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, for example 0.2.0. Leave empty to build 0.1.0-dev without a release.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - id: pick
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then v="${INPUT_VERSION#v}"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"
          else v=0.1.0-dev; fi
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            echo "::error::'$v' is not a version like 1.2.3 or 1.2.3-beta.1"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  package:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: osx-arm64
            os: macos-latest
          # Built on an Intel runner so the smoke test runs the binary natively.
          - rid: osx-x64
            os: macos-15-intel
          - rid: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Build the package
        shell: bash
        run: npm run package -- ${{ matrix.rid }} --version "$VERSION"

      - name: Smoke test the package
        shell: bash
        run: npm run smoke:package -- "dist-packages/Altrobe-$VERSION-${{ matrix.rid }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.rid }}
          path: dist-packages/*.zip
          if-no-files-found: error
          # The packages are zips already.
          compression-level: 0

  release:
    needs: [version, package]
    if: github.ref_type == 'tag' || inputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: packages
          merge-multiple: true

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "v$VERSION" packages/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Altrobe $VERSION" \
            --generate-notes \
            --draft "${prerelease[@]}"
