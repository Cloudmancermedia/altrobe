<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Altrobe look test</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; --bg: #1b1d22; --panel: #24272e; --text: #e6e6e6; --muted: #9aa0aa; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px system-ui, sans-serif; }
  #app { display: flex; height: 100%; }
  #view { flex: 1; min-width: 0; }
  #panel { width: 260px; overflow: auto; background: var(--panel); padding: 8px 12px; }
  #panel h2 { font-size: 12px; margin: 10px 0 4px; color: var(--muted); font-weight: 600; }
  label { display: inline-block; min-width: 72px; }
  #status { color: var(--muted); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <div id="view"></div>
  <div id="panel"><div id="status">loading...</div><div id="toggles"></div></div>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

import { compositeLook, toImageData } from './compositor.js';

// Serve the worktree root so ../../output/ resolves.
//   ?look=orc-male | undead-female   data-driven geosets + composited textures (output/looks/<name>.json)
//   ?model=<fdid>&texture=<fdid>&show=0,401,...   Step 3 mode: one texture on every mesh
//   ?scale=0.5   composite at half the layout size (look mode)
const params = new URLSearchParams(location.search);
const lookName = params.get('look');
const look = lookName ? await (await fetch(`../../output/looks/${lookName}.json`)).json() : null;
const fdid = look ? String(look.modelFileDataId) : params.get('model') ?? '917116';
const textureFdid = params.get('texture');

// Geoset group names from https://wowdev.wiki/M2/.skin (geoset = group * 100 + variant).
const GROUPS = { 0: 'hair', 1: 'facial 1', 2: 'facial 2', 3: 'facial 3', 4: 'gloves', 5: 'boots', 7: 'ears',
  8: 'sleeves', 9: 'legcuffs', 10: 'chest', 11: 'pants', 12: 'tabard', 13: 'trousers/robe', 15: 'cape',
  16: 'facial jewelry', 17: 'eye glow', 18: 'belt', 19: 'tail/bones', 20: 'feet', 22: 'torso', 32: 'face', 33: 'eyes' };

// Step 3 fallback set, chosen by eye for the Orc male body (917116). Look mode uses look.geosets,
// which tools/looks/looks.ts derives from ChrCustomization data. ?show=0,401,... overrides both.
const DEFAULTS = [0, 401, 501, 702, 1301, 1801, 2001, 2201, 3202, 3301];
const show = params.get('show')?.split(',').map(Number) ?? look?.geosets ?? DEFAULTS;
const isDefault = id => show.includes(id);

const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(devicePixelRatio);
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1d22);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444450, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.8);
sun.position.set(2, 3, 4);
scene.add(sun);
const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 100);
const controls = new OrbitControls(camera, renderer.domElement);

function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

const grey = new THREE.MeshStandardMaterial({ color: 0x8a9a6a, roughness: 0.8 });
let material = grey;
if (textureFdid) {
  const tex = await new THREE.TextureLoader().loadAsync(`../../output/textures/${textureFdid}.png`);
  tex.flipY = false; // glTF/WoW UV origin is top-left
  tex.colorSpace = THREE.SRGBColorSpace;
  material = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.8 });
}

// Look mode: composite every character texture type (1 skin, 6 hair, 19 eyes) in the browser.
// M2 texture types with no composited texture: type 0 loads its hardcoded FileDataID, anything
// else stays grey and is listed in window.lookStats.uncovered.
const typeMaterials = new Map();
const hardcoded = new Map();
if (look) {
  const scale = Number(params.get('scale') ?? 1);
  const t0 = performance.now();
  const { textures, stats } = await compositeLook(look, id => `../../output/textures/${id}.png`, { scale });
  for (const [type, t] of textures) {
    const tex = new THREE.DataTexture(t.pixels, t.width, t.height, THREE.RGBAFormat);
    tex.flipY = false;
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.magFilter = THREE.LinearFilter;
    tex.minFilter = THREE.LinearMipmapLinearFilter;
    tex.generateMipmaps = true;
    tex.needsUpdate = true;
    // Skin (1) draws opaque. Hair (6) and eyes (19) use their alpha as a cutout. The real blend
    // mode lives in the M2 material table, which the Step 3 converter does not export yet.
    const opts = type === 1 ? {} : { alphaTest: 0.5, side: THREE.DoubleSide };
    typeMaterials.set(type, new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85, ...opts }));
  }
  window.lookStats = { ...stats, totalMs: +(performance.now() - t0).toFixed(2), composited: textures.size, uncovered: [] };
  window.lookTextures = textures;
  window.lookImage = type => {
    const t = textures.get(type);
    const c = document.createElement('canvas');
    c.width = t.width; c.height = t.height;
    c.getContext('2d').putImageData(toImageData(t), 0, 0);
    return c.toDataURL('image/png');
  };
}

const meta = look ? await (await fetch(`../../output/models/${fdid}.json`)).json() : null;
async function lookMaterial(submeshIndex) {
  const unit = meta.geosets.find(g => g.submeshIndex === submeshIndex)?.textureUnits?.[0];
  const first = unit?.textures?.[0];
  if (!first) return grey;
  if (first.type === 0 && first.fileDataId) {
    if (!hardcoded.has(first.fileDataId)) {
      hardcoded.set(first.fileDataId, new THREE.TextureLoader().loadAsync(`../../output/textures/${first.fileDataId}.png`).then(tex => {
        tex.flipY = false;
        tex.colorSpace = THREE.SRGBColorSpace;
        // Shader 144 on these units is the eye-glow effect; draw it additively.
        const additive = unit.shaderId === 144;
        return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85, transparent: additive, alphaTest: additive ? 0 : 0.5,
          blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending, depthWrite: !additive, side: THREE.DoubleSide });
      }, () => grey));
    }
    return hardcoded.get(first.fileDataId);
  }
  if (typeMaterials.has(first.type)) return typeMaterials.get(first.type);
  const geosetId = meta.geosets.find(g => g.submeshIndex === submeshIndex)?.geosetId;
  if (isDefault(geosetId)) window.lookStats.uncovered.push({ submeshIndex, geosetId, textureType: first.type });
  return grey;
}

const gltf = await new GLTFLoader().loadAsync(`../../output/models/${fdid}.glb`);
const meshesById = new Map();
const meshes = [];
gltf.scene.traverse(o => { if (o.isMesh) meshes.push(o); });
for (const o of meshes) {
  const data = { ...o.parent?.userData, ...o.userData };
  const id = data.geosetId;
  o.material = look ? await lookMaterial(data.submeshIndex) : material;
  if (!meshesById.has(id)) meshesById.set(id, []);
  meshesById.get(id).push(o);
  o.visible = isDefault(id);
}
scene.add(gltf.scene);

// Frame the visible default geosets.
const box = new THREE.Box3();
for (const [id, list] of meshesById) if (isDefault(id)) list.forEach(m => box.expandByObject(m));
const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
controls.target.copy(center);
// WoW models face +X, which stays +X after the Y-up conversion, so look from +X.
camera.position.set(center.x + size.y * 2.2, center.y, center.z);
// ?view=head frames the top of the model for face close-ups.
if (params.get('view') === 'head') {
  const head = new THREE.Vector3(center.x, box.max.y - size.y * 0.12, center.z);
  controls.target.copy(head);
  camera.position.set(head.x + size.y * 0.75, head.y, head.z);
}
controls.update();

const toggles = document.getElementById('toggles');
const ids = [...meshesById.keys()].sort((a, b) => a - b);
let lastGroup = -1;
for (const id of ids) {
  const group = Math.floor(id / 100);
  if (group !== lastGroup) {
    const h = document.createElement('h2');
    h.textContent = `${group}xx ${GROUPS[group] ?? ''}`;
    toggles.appendChild(h);
    lastGroup = group;
  }
  const label = document.createElement('label');
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.checked = isDefault(id);
  cb.dataset.geoset = id;
  cb.onchange = () => meshesById.get(id).forEach(m => (m.visible = cb.checked));
  label.append(cb, ` ${id}`);
  toggles.appendChild(label);
}
document.getElementById('status').textContent = `${look ? `look ${lookName}, ` : ''}model ${fdid}: ${ids.length} geosets, ${ids.filter(isDefault).length} shown`;

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
window.viewerReady = true;
</script>
</body>
</html>
